[package]
name = "mopet"
version = "0.1.0"
edition = "2024"

[lib]
name = "mopet"
path = "src/lib.rs"

[[bin]]
name = "mopet"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
crossterm = "0.28"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"

[workspace]
members = [
    ".",
    "etapas/etapa_1_decodificador",
    "etapas/etapa_2_estado_pista",
    "etapas/etapa_3_motor_dsp",
    "etapas/etapa_4_planes_cola",
    "etapas/etapa_5_interfaz_tui",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
